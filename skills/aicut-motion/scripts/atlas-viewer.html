<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>86 archived styles — preview</title>
<style>
  :root{
    --ink:#0d0d0f; --card:#16161a; --line:#2c2c33; --tx:#ecebe7; --tx2:#a5a39d; --tx3:#6e6c67; --hot:#e05a3d;
    --sans:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:"JetBrains Mono","SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--tx);font-family:var(--sans);font-size:14px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:15px;font-weight:500;letter-spacing:-.01em}
  .sub{font-family:var(--mono);font-size:11px;color:var(--tx3);letter-spacing:.06em}
  .grow{flex:1}
  select,input[type=range],button{font-family:inherit}
  select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:3px;padding:7px 10px;font-size:13px;max-width:340px}
  button{background:var(--card);color:var(--tx2);border:1px solid var(--line);border-radius:3px;padding:7px 11px;font-size:12px;cursor:pointer;line-height:1.2}
  button:hover{color:var(--tx);border-color:var(--tx3)}
  button:disabled{opacity:.4;cursor:default}
  main{max-width:1180px;margin:0 auto;padding:20px}
  canvas{width:100%;height:auto;display:block;background:#111;border:1px solid var(--line);border-radius:3px}
  .transport{display:flex;align-items:center;gap:12px;margin-top:12px}
  input[type=range]{flex:1;accent-color:var(--hot);height:18px}
  .clock{font-family:var(--mono);font-size:11.5px;color:var(--tx3);min-width:96px;text-align:right}
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;margin-top:18px}
  @media (max-width:860px){.cols{grid-template-columns:1fr}}
  .cols p{margin:0 0 10px;font-size:13px;line-height:1.65;color:var(--tx2)}
  .cols b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--hot);margin-bottom:3px;font-weight:500}
  .note{font-size:12px;color:var(--tx3);line-height:1.6;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
  code{font-family:var(--mono);font-size:11.5px;color:#cfcdc7;background:rgba(255,255,255,.055);padding:1px 5px;border-radius:2px}
  .meta{font-family:var(--mono);font-size:10.5px;color:#4e4e57;word-break:break-all;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>86 archived styles</h1>
  <span class="sub">harness.js + code.js + a t</span>
  <div class="grow"></div>
  <button id="prev" title="上一种（←）">←</button>
  <select id="pick"></select>
  <button id="next" title="下一种（→）">→</button>
  <button id="play" title="播放 / 暂停（空格）">暂停</button>
</header>

<main>
  <canvas id="c" width="1920" height="1080"></canvas>
  <div class="transport">
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="时间">
    <span class="clock" id="clock">0.00 / 6.00 s</span>
  </div>

  <div class="cols">
    <div>
      <p><b>看</b><span id="desc">—</span></p>
      <p><b>动</b><span id="motion">—</span></p>
    </div>
    <div>
      <p><b>讲</b><span id="who">—</span></p>
      <p class="note">这个页面只是档案的预览壳：它加载 <code>lib/harness.js</code> 和某一套的 <code>code.js</code>，然后把 <code>t</code> 递进去。
      片子要的是这种时间结构，不是这个文件本身——把它移植成 AICUT 页面里的 <code>frame(t)</code>，而不是嵌进来。</p>
      <div class="meta" id="meta"></div>
    </div>
  </div>
</main>

<script src="../assets/atlas/lib/harness.js"></script>

<script>
(function () {
  var BASE = '../assets/atlas';
  var FALLBACK = JSON.parse(document.getElementById('fallback').textContent).map(function (r) {
    return { id: r[0], name: r[1], nameZh: r[2], family: r[3], familyZh: r[4], folder: r[5] };
  });
  var el = {
    pick: document.getElementById('pick'), canvas: document.getElementById('c'),
    play: document.getElementById('play'), scrub: document.getElementById('scrub'),
    clock: document.getElementById('clock'), desc: document.getElementById('desc'),
    motion: document.getElementById('motion'), who: document.getElementById('who'), meta: document.getElementById('meta')
  };
  var ctx = el.canvas.getContext('2d');
  var styles = FALLBACK, style = null, raf = 0, playing = true, base = 0, tNow = 0, loading = false;

  function boot(list) {
    styles = list;
    el.pick.innerHTML = '';
    for (var i = 0; i < styles.length; i++) {
      var s = styles[i];
      var label = String(s.id).padStart(3, '0') + ' · ' + s.nameZh + ' · ' + s.name;
      el.pick.add(new Option(label, String(s.id)));
    }
    var want = Number(new URLSearchParams(location.search).get('id') || 26);
    var has = styles.some(function (s) { return s.id === want; });
    el.pick.value = String(has ? want : 1);
    show(has ? want : 1);
  }

  function show(id) {
    var row = null;
    for (var i = 0; i < styles.length; i++) if (styles[i].id === Number(id)) row = styles[i];
    if (!row || loading) return;
    loading = true;
    cancelAnimationFrame(raf);
    if (window.STYLES) window.STYLES.length = 0;
    var old = document.querySelector('script[data-style]');
    if (old) old.remove();
    var tag = document.createElement('script');
    tag.src = BASE + '/styles/' + row.folder + '/code.js';
    tag.dataset.style = '1';
    tag.onload = function () {
      loading = false;
      style = window.STYLES && window.STYLES[0];
      if (!style || typeof style.draw !== 'function') {
        el.desc.textContent = '这一套没有注册可绘制的风格（' + row.folder + '）';
        return;
      }
      el.desc.textContent = style.description || row.nameZh;
      el.motion.textContent = style.motion || '—';
      el.who.textContent = row.nameZh + ' · ' + row.name + ' · ' + row.familyZh + ' / ' + row.family;
      el.meta.textContent = 'duration ' + style.duration + 's · ' + BASE + '/styles/' + row.folder + '/code.js';
      history.replaceState(null, '', '?id=' + row.id);
      base = performance.now();
      tNow = 0;
      playing = true;
      el.play.textContent = '暂停';
      draw();
    };
    tag.onerror = function () { loading = false; el.desc.textContent = '加载失败：' + row.folder; };
    document.body.appendChild(tag);
  }

  function draw() {
    cancelAnimationFrame(raf);
    var tick = function () {
      raf = requestAnimationFrame(tick);
      if (!style) return;
      if (playing) tNow = ((performance.now() - base) / 1000) % style.duration;
      paint(style, tNow);
      el.scrub.value = String(Math.round((tNow / style.duration) * 1000));
      el.clock.textContent = tNow.toFixed(2) + ' / ' + style.duration.toFixed(2) + ' s';
    };
    tick();
  }

  function paint(s, t) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, el.canvas.width, el.canvas.height);
    try { s.draw(ctx, el.canvas.width, el.canvas.height, t); }
    catch (err) { el.desc.textContent = 'draw 出错：' + err.message; playing = false; el.play.textContent = '播放'; }
    ctx.restore();
  }

  function step(delta) {
    var ids = styles.map(function (s) { return s.id; });
    var at = ids.indexOf(Number(el.pick.value));
    var next = (at + delta + ids.length) % ids.length;
    el.pick.value = String(ids[next]);
    show(ids[next]);
  }

  el.pick.addEventListener('change', function () { show(el.pick.value); });
  el.play.addEventListener('click', function () {
    playing = !playing;
    el.play.textContent = playing ? '暂停' : '播放';
    base = performance.now() - tNow * 1000;
  });
  el.scrub.addEventListener('input', function () {
    if (!style) return;
    playing = false;
    el.play.textContent = '播放';
    tNow = (Number(el.scrub.value) / 1000) * style.duration;
    paint(style, tNow);
    el.clock.textContent = tNow.toFixed(2) + ' / ' + style.duration.toFixed(2) + ' s';
  });
  document.getElementById('prev').addEventListener('click', function () { step(-1); });
  document.getElementById('next').addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); el.play.click(); }
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
  });

  fetch('../references/style-index.json')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (list) { boot(list && list.length ? list : FALLBACK); })
    .catch(function () { boot(FALLBACK); });
})();
</script>
